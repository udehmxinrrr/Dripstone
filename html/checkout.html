<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DripStone - Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/checkout.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>

<header class="site-header">
  <nav class="navbar">
    <a href="../html/index.html" class="brand">
      <span class="brand-mark">D</span>
      <span class="brand-name">DripStone</span>
    </a>
    <div class="nav-icons"></div>
  </nav>
</header>

<main class="checkout-page">
  <h1 class="checkout-title">CHECK<span class="accent">OUT.</span></h1>

  <form id="checkoutForm" novalidate>
    <div class="checkout-layout">

      <div class="checkout-forms">

        <div class="checkout-section">
          <p class="checkout-section-title">Contact</p>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <p class="form-error" data-error-for="email">Enter a valid email address.</p>
          </div>
          <div class="form-field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required autocomplete="tel">
            <p class="form-error" data-error-for="phone">Enter a valid phone number.</p>
          </div>
        </div>

        <div class="checkout-section">
          <p class="checkout-section-title">Shipping Address</p>
          <div class="form-row">
            <div class="form-field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
              <p class="form-error" data-error-for="firstName">Required.</p>
            </div>
            <div class="form-field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" required autocomplete="family-name">
              <p class="form-error" data-error-for="lastName">Required.</p>
            </div>
          </div>
          <div class="form-field">
            <label for="address">Street Address</label>
            <input type="text" id="address" name="address" required autocomplete="address-line1">
            <p class="form-error" data-error-for="address">Required.</p>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required autocomplete="address-level2">
              <p class="form-error" data-error-for="city">Required.</p>
            </div>
            <div class="form-field">
              <label for="postalCode">Postal Code</label>
              <input type="text" id="postalCode" name="postalCode" required autocomplete="postal-code">
              <p class="form-error" data-error-for="postalCode">Required.</p>
            </div>
          </div>
        </div>

        <div class="checkout-section">
          <p class="checkout-section-title">Payment Method</p>
          <div class="payment-methods" id="paymentMethods">
            <p class="payment-unavailable">Loading payment options…</p>
          </div>
          <p class="form-error" data-error-for="paymentMethod">Select a payment method.</p>
        </div>

      </div>

      <aside class="checkout-summary" id="checkoutSummary">
      </aside>

    </div>
  </form>
</main>

<footer class="site-footer">
  <div class="footer-bottom" style="max-width:1100px;margin:0 auto;">
    <p>&copy; 2026 DripStone. All rights reserved.</p>
  </div>
</footer>

<script src="../javascript/sanity.js"></script>
<script src="../javascript/cart.js"></script>
<script src="../javascript/checkout.js"></script>
</body>
</html>
